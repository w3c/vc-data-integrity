id: T6
name: Hardware Key Stores Limited to Classical Cryptosuites
elements: [S1, P3, E1, E2, C2]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Spoofing
description: >-
  Many deployments keep private keys in a [=S1|security module=] built into
  hardware, such as a hardware security module, a trusted platform module,
  or the secure element or secure enclave of a mobile device (see R6). This
  is common in digital wallets: when a wallet creates a proof, for example
  on a [=verifiable presentation=] or to demonstrate that a credential is
  bound to its holder, the [=C2|holder system=] acts as a [=E1|signer=] and
  its secure hardware acts as the [=S1|security module=]. The algorithms
  such a module can run are fixed by its hardware and firmware. Many
  deployed modules support only a small set of classical algorithms, in
  some cases only ECDSA over the P-256 curve, and keys generated inside them
  cannot be exported for use with any other algorithm. Newer hardware and
  operating system releases have begun to add post-quantum algorithms, such
  as ML-DSA, to some secure enclaves, but devices that are not updated or
  replaced (because the hardware cannot support the new algorithms, because
  the vendor no longer ships updates, or because the owner cannot afford a
  new device) remain limited to the algorithms they shipped with. For keys
  held in such hardware, the cryptographic agility of the [=cryptosuite=]
  architecture (R13) does not help: the [=P3|sign=] process can only
  produce proofs with a [=cryptosuite=] that the module already supports,
  and a proof set (R14) cannot include a post-quantum proof made with the
  hardware-bound key. Once a cryptographically relevant quantum computer
  exists (T5), an attacker who has observed the public key of a
  hardware-bound classical key can recover the private key and spoof the
  [=E2|holder=] or [=E1|signer=] it belongs to, even though the private key
  never left the hardware. The risk falls hardest on [=E2|holders=] who
  keep using older devices, whereas operators of server-side or cloud
  hardware security modules can usually upgrade or replace them.
response:
  - id: R16
    name: Software-Held Post-Quantum Proofs in Proof Sets
    type: Reduce
    description: >-
      A wallet or [=C1|signing system=] whose hardware cannot run a
      post-quantum algorithm can still add a proof made with a
      post-quantum [=cryptosuite=] and a software-held key, alongside the
      hardware-bound classical proof, in a proof set (R14). [=E1|Signers=]
      such as [=issuers=], who usually control upgradable security modules,
      can likewise add post-quantum proofs to the documents they issue. A
      software-held key is easier to extract than a hardware-bound key
      (see T3), so this approach trades some protection against key
      exfiltration today for protection against quantum forgery later;
      each deployment weighs that trade-off against its own risks.
  - id: R17
    name: Algorithm-Agile Key Selection and Migration
    type: Reduce
    description: >-
      Wallets that check which algorithms the device's hardware supports,
      rather than assuming a single fixed [=cryptosuite=], can move to a
      post-quantum [=cryptosuite=] as soon as the hardware or operating
      system offers one, generate new keys, rotate them into the
      [=verification methods=] they control (see R7), and request
      re-issuance of credentials that are bound to the old keys.
      [=E3|Verifiers=] that publish which [=cryptosuites=] they accept, and
      that can stop accepting classical-only proofs on a stated schedule,
      give [=E2|holders=] and [=E1|signers=] a clear signal for when that
      migration needs to be complete.
  - id: R18
    name: Residual Risk for Hardware That Cannot Be Upgraded
    type: Accept
    description: >-
      Hardware that cannot run a post-quantum algorithm can never create a
      post-quantum hardware-bound proof. Once classical [=cryptosuites=]
      are no longer trusted, keys held only in such hardware can no longer
      produce proofs that [=E3|verifiers=] accept, and their
      [=E2|holders=] need a different key, a different device, or a
      software-based alternative to keep using their credentials. This
      residual risk falls hardest on holders who cannot replace their
      devices; ecosystems that rely on hardware-bound holder keys can plan
      for it by keeping a path to re-issue credentials to new keys.
